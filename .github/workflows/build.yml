name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed to attach zips to tagged releases

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Test engine
        if: matrix.arch == 'x64'
        run: dotnet test tests/OpenLine.Core.Tests -c Release
      - name: Publish portable build
        shell: pwsh
        run: ./build.ps1 -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: OpenLine-win-${{ matrix.arch }}
          path: dist/OpenLine-win-${{ matrix.arch }}.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/OpenLine-win-${{ matrix.arch }}.zip
